name: Setup Appwrite schema

# Cria/atualiza banco, 19 tabelas, buckets e as 2 functions no Appwrite Cloud
# a partir do appwrite.config.json. Rode manualmente: Actions > Setup Appwrite
# schema > Run workflow. O runner do GitHub tem acesso ao Appwrite Cloud.
#
# Pré-requisitos (Settings > Secrets and variables > Actions):
#   - Secret  APPWRITE_API_KEY          (chave server-side; NÃO usar Variables)
#   - Variable/Secret VITE_APPWRITE_ENDPOINT   (ex.: https://nyc.cloud.appwrite.io/v1)
#   - Variable/Secret VITE_APPWRITE_PROJECT_ID

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build functions bundle
        run: npm run functions:build
      - name: Configure Appwrite CLI
        env:
          ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || secrets.VITE_APPWRITE_ENDPOINT }}
          PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || secrets.VITE_APPWRITE_PROJECT_ID }}
          API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Falta o Secret APPWRITE_API_KEY (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          npx appwrite client --endpoint "$ENDPOINT" --project-id "$PROJECT_ID" --key "$API_KEY"
      # Empurra só tables (database + 19 tabelas) e functions. NÃO empurra
      # 'settings' (exige sessão de console) nem 'buckets' (limite do plano Free
      # — avatars/receipts entram na F5/F6). O primeiro push de tables é
      # tolerante ao aviso "re-run to continue" que ocorre quando o CLI remove
      # um database remoto divergente; o segundo conclui as criações.
      # O database 'morada' vem do bloco `tablesDB` do config; push tables cria
      # database + tabelas. (Antes o database estava na chave errada `databases`
      # e o push apagava o remoto.)
      - name: Push database + tables
        run: npx appwrite push tables --all --force
      - name: Push functions
        run: npx appwrite push functions --all --force --activate true --no-logs
      - name: Verify tables created
        run: |
          echo "Tabelas em 'morada':"
          npx appwrite tables-db list-tables --database-id morada
