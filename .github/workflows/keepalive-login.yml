name: Appwrite keepalive (login)

# Anti-pausa via ATIVIDADE DE DESENVOLVEDOR: a cada ~5 dias loga na conta
# (e-mail/senha) e faz uma chamada de conta — réplica de abrir o Console, a única
# coisa que o plano Free conta como atividade. Tráfego com API key (CRUD/deploy)
# é ignorado, então este caminho não usa API key.
#
# Só dispara por agenda a partir do branch padrão do repositório.
#
# Secrets (Settings > Secrets and variables > Actions):
#   - APPWRITE_EMAIL     (secret) — e-mail de login do Appwrite
#   - APPWRITE_PASSWORD  (secret) — senha de login do Appwrite
#   - projeto: reaproveita VITE_APPWRITE_PROJECT_ID (ou defina APPWRITE_PROJECT_ID).
#   - o login vai no Console (projeto `console` em cloud.appwrite.io), onde vive a
#     conta de desenvolvedor; override opcional via APPWRITE_CONSOLE_ENDPOINT.
# A conta NÃO pode ter 2FA (login programático quebra com MFA).

on:
  schedule:
    - cron: '0 6 */5 * *' # 06:00 UTC a cada 5 dias
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appwrite-keepalive-login
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    env:
      APPWRITE_CONSOLE_ENDPOINT: ${{ vars.APPWRITE_CONSOLE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID || secrets.APPWRITE_PROJECT_ID || vars.VITE_APPWRITE_PROJECT_ID || secrets.VITE_APPWRITE_PROJECT_ID }}
      APPWRITE_EMAIL: ${{ secrets.APPWRITE_EMAIL }}
      APPWRITE_PASSWORD: ${{ secrets.APPWRITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sanity — secrets presentes
        run: |
          test -n "$APPWRITE_PROJECT_ID" || { echo '::error::APPWRITE_PROJECT_ID vazio'; exit 1; }
          test -n "$APPWRITE_EMAIL"      || { echo '::error::APPWRITE_EMAIL vazio (adicione o secret)'; exit 1; }
          test -n "$APPWRITE_PASSWORD"   || { echo '::error::APPWRITE_PASSWORD vazio (adicione o secret)'; exit 1; }
      - name: Login (registra atividade de desenvolvedor)
        run: node scripts/keepalive-login.mjs
