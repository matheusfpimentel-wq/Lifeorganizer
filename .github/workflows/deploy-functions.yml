name: Deploy functions

# Publica SOMENTE as 2 functions (tick e api). Não toca em tables — mudanças
# de schema vão pelo "Schema hotfix" (auditoria que nunca apaga nada).
on:
  workflow_dispatch:

jobs:
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build functions bundle
        run: npm run functions:build
      - name: Configure Appwrite CLI
        env:
          ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT || secrets.VITE_APPWRITE_ENDPOINT }}
          PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID || secrets.VITE_APPWRITE_PROJECT_ID }}
          API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: npx appwrite client --endpoint "$ENDPOINT" --project-id "$PROJECT_ID" --key "$API_KEY"
      - name: Push functions
        run: |
          n=0
          until npx appwrite push functions --all --force --activate true --no-logs; do
            n=$((n+1))
            if [ $n -ge 5 ]; then echo "push functions falhou após $n tentativas"; exit 1; fi
            echo "falha transitória — tentativa $n, aguardando..."; sleep 8
          done
